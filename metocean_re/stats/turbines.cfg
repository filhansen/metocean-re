# Built-in turbine types.
#
# Each section is one turbine. Units:
#   rated_power     MW
#   cut_in          m/s   wind speed where the turbine starts producing
#   rated_speed     m/s   wind speed where rated power is reached
#   cut_out         m/s   wind speed where the turbine shuts down
#   hub_height      m     above mean sea level
#   rotor_diameter  m
#
# You can write your own file in the same format and load it with
# wind_energy.turbines.load("my_turbines.cfg").

[NREL-5MW]
rated_power = 5.0
cut_in = 3.0
rated_speed = 11.4
